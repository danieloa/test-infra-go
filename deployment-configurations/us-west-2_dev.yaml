environment: dev
customer: danieloa
# region is read from AWS_REGION environment variable
vpc_cidr: "10.0.10.0/16"
# subnets are automatically calculated from vpc_cidr and divided across availability zones
availability_zones: ["us-west-2a", "us-west-2b", "us-west-2c"]
product_domain: danieloa-vpc.example.com
# Company IP for secure access to EKS HTTPS endpoint (use your office/VPN IP in CIDR format)
company_ip: "0.0.0.0/0"  # Change this to your company IP for production
